<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionPort Live Portal: Indian Traffic Analyzer</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-primary) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem;
    }

    .visionport-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
      padding: 1rem 0;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .status-online {
      color: var(--success);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-online::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 2rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 860px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    .upload-section {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.2rem;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .upload-section:hover {
      border-color: var(--accent);
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-2px);
    }

    .upload-section h3 {
      font-size: 1.2rem;
      color: var(--text-main);
    }

    .upload-section input[type="file"] {
      display: none;
    }

    .custom-file-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: 0.2s;
    }

    .custom-file-btn:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: scale(1.02);
    }

    .results-display {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .view-panel h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-panel h4::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      min-height: 380px;
      background: #090d16;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e293b;
    }

    #output-preview {
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      display: block;
      transition: opacity 0.3s ease;
    }

    .loading-spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- VisionPort Dashboard Component -->
  <div class="visionport-container">
    <header>
      <h1>VisionPort Live Portal: Indian Traffic Analyzer</h1>
      <p>Upload a street snapshot to see deep learning inference instantly.</p>
    </header>

    <!-- Status Cards -->
    <div class="metrics-grid">
      <div class="card"><strong>System Status:</strong> <span class="status-online">Active</span></div>
      <div class="card"><strong>Model Architecture:</strong> YOLOv8 Nano</div>
      <div class="card"><strong>Avg Latency:</strong> ~45ms</div>
    </div>

    <!-- Main Interface -->
    <div class="workspace">
      <div class="upload-section" onclick="document.getElementById('traffic-uploader').click()">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <h3>Drop Traffic Image Here</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem;">or click to browse from device</p>
        <label class="custom-file-btn">Choose Image</label>
        <input type="file" id="traffic-uploader" accept="image/*" onchange="processImage(event)" />
      </div>

      <div class="results-display">
        <div class="view-panel">
          <h4>Live Output Stream</h4>
          <div class="image-wrapper">
            <div class="loading-spinner" id="loading-spinner"></div>
            <img id="output-preview" src="sample_traffic.jpg" alt="Inference Output" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);

      // Update UI to show processing state
      const outputImg = document.getElementById("output-preview");
      const spinner = document.getElementById("loading-spinner");
      outputImg.style.opacity = "0.35";
      if (spinner) spinner.style.display = "block";

      try {
        // Hit the FastAPI backend endpoint
        const response = await fetch("http://localhost:8000/detect/", {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error("Inference failed with status " + response.status);

        // Convert the returning stream into a displayable URL object
        const blob = await response.blob();
        outputImg.src = URL.createObjectURL(blob);
      } catch (error) {
        alert("Error contacting the deep learning backend: " + error.message);
      } finally {
        outputImg.style.opacity = "1";
        if (spinner) spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>
